[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casca"
version = "0.1.0"
description = "Thesis companion for CA-SCA, AA-CASCA, CPA, and MOC on ASCAD v1 fixed-key"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.2",
    "h5py==3.16.0",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "matplotlib==3.11.1",
    "pandas==3.0.5",
    "torch==2.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]
